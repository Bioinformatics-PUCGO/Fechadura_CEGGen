<!DOCTYPE html>
<!--
=====================================================================
  CADEADO DIGITAL — CEGGen × GenIA
  A pessoa gira as 3 rodinhas (ou digita os números) e toca em "Abrir
  cadeado". Só abre com o código certo.

  1. TROCAR O CÓDIGO
     O código NÃO fica escrito neste arquivo: só a sua "impressão digital"
     (hash SHA-256) em CODIGO_HASH. Para gerar a do novo código, abra a página
     com  ?hash=NOVOCODIGO  no final do endereço (ex.: ?hash=123), copie a
     linha que aparece e cole no lugar de CODIGO_HASH.
     Importante: se mudar o SAL, gere o hash de novo.

  2. CARTAZ COM QR CODE
     Publique a página e abra o endereço com  ?cartaz  no final.
     O QR Code aponta para o endereço de onde a página foi aberta.
     (Opcional: ?cartaz&url=https://outro-endereco/ gera o QR de outro endereço.)

  3. TEXTO DE SUCESSO, TENTATIVAS E ESPERA
     Em MENSAGEM, MAX_ERROS e ESPERA_S, logo abaixo.

  4. PUBLICAR NO GITHUB PAGES
     Crie uma pasta no repositório (ex.: Fechadura_CEGGen), envie este
     index.html e ative o GitHub Pages. Não precisa de mais nenhum arquivo.

  Honestidade sobre segurança: com 3 dígitos há só 1000 combinações, e
  qualquer página pública pode ser testada por tentativa e erro. O hash e a
  espera depois de erros impedem espiar o código no arquivo e dificultam
  o chute, mas a proteção de verdade é o cadeado físico.
=====================================================================
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadeado digital · CEGGen × GenIA</title>
<meta name="description" content="Descubra o código de 3 dígitos e abra o cadeado.">
<meta name="theme-color" content="#EAF3FA">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --vidro:rgba(255,255,255,.92); --borda:rgba(16,92,150,.22);
  --texto:#10263A; --mudo:#46607A; --acc:#07739A; --ok:#157A43; --erro:#B3261E;
  --font:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  --hh:58px; color-scheme:light; box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{min-height:100%}
body{margin:0;color:var(--texto);font-family:var(--font);font-size:16px;line-height:1.5;
  background:radial-gradient(1200px 760px at 55% 30%,#FFFFFF 0%,#E3EFF8 58%,#CFE2F0 100%);background-color:#EAF3FA;background-attachment:fixed;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #00A3D9;outline-offset:2px}
[hidden]{display:none!important}

.topo{position:sticky;top:0;z-index:5;height:var(--hh);display:flex;align-items:center;justify-content:center;gap:20px;padding:0 16px;
  background:var(--vidro);border-bottom:1px solid var(--borda);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px -24px rgba(16,70,120,.6)}
.topo img{display:block;width:auto}.topo .a{height:28px}.topo .b{height:46px}.topo .v{width:1px;height:26px;background:var(--borda)}
main{min-height:calc(100vh - var(--hh));min-height:calc(100dvh - var(--hh));display:grid;place-items:center;padding:22px 16px 28px}
.cartao{width:min(440px,100%);padding:24px 22px 22px;background:var(--vidro);border:1px solid var(--borda);border-radius:26px;text-align:center;
  box-shadow:0 26px 60px -34px rgba(16,70,120,.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);margin:0 0 6px}
h1{font-size:clamp(1.55rem,6vw,1.95rem);font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0 0 6px}
.sub{color:var(--mudo);margin:0 0 6px;font-size:.96rem}

/* cadeado */
.cadeado{width:124px;height:150px;display:block;margin:6px auto 4px;overflow:visible}
.cadeado .grilhao{transform-origin:30px 56px;transition:transform .7s cubic-bezier(.3,1.5,.4,1)}
.cadeado .corpo{transition:fill .4s}
.cartao.aberto .grilhao{transform:rotate(-42deg) translate(-4px,-4px)}
.cartao.aberto .corpo{fill:url(#gAberto)}
.cartao.erro .cadeado{animation:treme .5s}
.cartao.erro .corpo{fill:url(#gErro)}
@keyframes treme{0%,100%{transform:translateX(0)}15%{transform:translateX(-9px)}35%{transform:translateX(8px)}55%{transform:translateX(-6px)}75%{transform:translateX(4px)}}

/* rodinhas */
.rodas{display:flex;gap:14px;justify-content:center;margin:12px 0 16px}
.roda{display:flex;flex-direction:column;align-items:center;gap:8px}
.seta{width:68px;height:44px;border-radius:12px;border:1px solid var(--borda);background:#fff;color:var(--acc);font-size:1.05rem;line-height:1;box-shadow:0 6px 14px -10px rgba(16,70,120,.7)}
.seta:active:not(:disabled){background:#E3F3FA}
.dig{width:68px;height:88px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:3.1rem;color:#fff;border-radius:16px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ns-resize;
  background:linear-gradient(180deg,#071c33,#0f3f66 50%,#071c33);
  box-shadow:inset 0 0 0 2px rgba(120,200,235,.5),inset 0 12px 18px rgba(0,0,0,.5),inset 0 -12px 18px rgba(0,0,0,.5),0 10px 22px -14px rgba(7,28,51,.9);text-shadow:0 0 14px rgba(120,210,255,.6)}
.dig.muda{animation:sobe .22s ease-out}
@keyframes sobe{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
.rodas.travado .dig,.rodas.travado .seta{opacity:.45;pointer-events:none}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:12px 22px;border-radius:15px;border:1px solid transparent;
  background:linear-gradient(135deg,#0B78A5,#0A6A96);color:#fff;font-size:1.05rem;font-weight:700;letter-spacing:.01em;box-shadow:0 14px 28px -16px rgba(7,115,154,.85);transition:filter .2s,transform .15s}
@media (hover:hover){.btn:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}}
.btn:disabled{background:rgba(150,178,200,.5);box-shadow:none;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--texto);border-color:var(--borda);box-shadow:none;min-height:48px;font-size:.95rem;margin-top:10px}
#msg{min-height:1.7em;margin:12px 0 0;font-weight:600;font-size:.95rem;color:var(--mudo)}
.cartao.erro #msg{color:var(--erro)}

/* sucesso */
.sucesso h1{color:var(--ok)}
.hora{display:inline-block;font-family:var(--mono);font-weight:700;font-size:1.4rem;letter-spacing:.06em;color:#06476B;background:#E3F3FA;border-radius:12px;padding:6px 16px;margin:4px 0 12px}
.hora small{display:block;font-family:var(--font);font-weight:500;font-size:.72rem;letter-spacing:0;color:var(--mudo)}
.rodape{margin:16px 0 0;font-size:.72rem;color:var(--mudo)}

/* ferramentas da equipe */
.helper{margin:14px 0 0;padding:10px 12px;border-radius:12px;background:#F2F7FB;border:1px dashed var(--borda);text-align:left;font-size:.78rem}
.helper code{display:block;margin-top:6px;word-break:break-all;font-family:var(--mono);font-size:.74rem;color:#06476B}

/* cartaz A4 */
#cartaz{position:fixed;inset:0;z-index:30;overflow:auto;background:#CFE0EE;padding:0 0 40px}
.ferr{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:12px 16px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--borda)}
.ferr .btn{width:auto;min-height:46px}.ferr p{margin:0;font-size:.82rem;color:var(--mudo);max-width:60ch}.ferr .alerta{color:var(--erro);font-weight:600}
.folha{position:relative;width:210mm;height:297mm;margin:18px auto;background:#fff;color:#0B2540;overflow:hidden;box-shadow:0 20px 50px -26px rgba(16,70,120,.7);display:flex;flex-direction:column;align-items:center;padding:14mm 22mm 10mm;text-align:center}
.folha .dna{position:absolute;top:0;bottom:0;width:18mm}.folha .dna.e{left:2mm}.folha .dna.d{right:2mm;transform:scaleX(-1)}
.folha .lg{display:flex;align-items:center;gap:7mm;margin-bottom:6mm}.folha .lg img{height:13mm;width:auto}.folha .lg img.b{height:22mm}.folha .lg .v{width:.3mm;height:12mm;background:#CFDCE8}
.folha .eb{font-family:var(--mono);font-weight:700;font-size:4.2mm;letter-spacing:1.4mm;color:#07739A;margin:0 0 3mm}
.folha h2{font-size:13mm;font-weight:700;line-height:1.05;letter-spacing:-.3mm;margin:0 0 2mm;color:#06476B}
.folha .md{display:inline-block;font-size:6mm;font-weight:600;color:#06476B;background:#E3F3FA;border-radius:99mm;padding:1.5mm 6mm;margin:2mm 0 6mm}
.folha .qr{padding:5mm;border:.6mm solid #0B2540;border-radius:7mm;background:#fff;line-height:0}.folha .qr svg{width:104mm;height:104mm;display:block}
.folha .ct{font-size:5.8mm;font-weight:600;margin:7mm 0 3mm;white-space:nowrap}
.folha ol{margin:0 0 4mm;padding:0;list-style:none;display:grid;gap:2mm;text-align:left;font-size:4.4mm;color:#35506A}
.folha ol li{display:flex;gap:3mm;align-items:center}.folha ol b{flex:none;width:7mm;height:7mm;border-radius:50%;background:#0B78A5;color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:3.6mm}
.folha .cr{font-size:3.2mm;color:#6B8399;margin:auto 0 0}
@page{size:A4;margin:0}
@media print{ body{background:#fff} #cartaz{position:static;overflow:visible;background:#fff;padding:0} .ferr,.topo,main{display:none!important} .folha{margin:0;box-shadow:none} }
@media screen and (max-width:820px){ .folha{zoom:.42} }
@media (max-width:360px){ .rodas{gap:10px} .seta,.dig{width:60px} .topo{gap:14px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>

<script>
/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */
// Impressão digital (SHA-256) de SAL + código. O código em si não está neste arquivo.
const SAL = "cadeado-ceggen-2026";
const CODIGO_HASH = "e8efe06683194367137801d639fa239b39b2fb21876a63ddef2b0fcb53973f7a";

const MENSAGEM = {
  titulo: "Cadeado aberto!",
  texto: "Parabéns, você descobriu o código. Mostre esta tela à equipe do estande."
};
const MAX_ERROS = 5;      // erros seguidos antes de pedir para esperar
const ESPERA_S  = 15;     // segundos de espera (dobra a cada nova rodada de erros)

/* =========================================================
   SHA-256 (sem dependências, funciona também fora de HTTPS)
   ========================================================= */
function sha256(texto){
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const m = Array.from(new TextEncoder().encode(texto)), bits = m.length * 8;
  m.push(0x80); while(m.length % 64 !== 56) m.push(0);
  for(let i = 7; i >= 0; i--) m.push(i > 3 ? 0 : (bits >>> (i * 8)) & 255);
  let h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const rr = (x, n) => (x >>> n) | (x << (32 - n));
  for(let o = 0; o < m.length; o += 64){
    const w = new Array(64);
    for(let i = 0; i < 16; i++) w[i] = (m[o+i*4] << 24) | (m[o+i*4+1] << 16) | (m[o+i*4+2] << 8) | m[o+i*4+3];

    }
    h = [h[0]+a|0,h[1]+b|0,h[2]+c|0,h[3]+d|0,h[4]+e|0,h[5]+f|0,h[6]+g|0,h[7]+hh|0];
  }
  return h.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
}

/* =========================================================
   CADEADO
   ========================================================= */
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const cartao = $("cartao"), msg = $("msg");
const valores = [0, 0, 0]; let erros = 0, rodadas = 0, travado = false, relogio = null, espera = null;

function construirRodas(){
  const box = $("rodas");
  for(let i = 0; i < 3; i++){
    const r = document.createElement("div"); r.className = "roda";
    r.innerHTML = `<button type="button" class="seta" aria-label="Aumentar o dígito ${i+1}">▲</button>
      <div class="dig" id="dig${i}" tabindex="0" role="spinbutton" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0" aria-label="Dígito ${i+1} de 3">0</div>
      <button type="button" class="seta" aria-label="Diminuir o dígito ${i+1}">▼</button>`;
    const [mais, dig, menos] = r.children;
    mais.onclick = () => mudar(i, 1); menos.onclick = () => mudar(i, -1);
    dig.addEventListener("keydown", e => {
      if(/^[0-9]$/.test(e.key)){ definir(i, +e.key); if(i < 2) $("dig" + (i + 1)).focus(); else $("btnAbrir").focus(); e.preventDefault(); }
      else if(e.key === "ArrowUp"){ mudar(i, 1); e.preventDefault(); }
      else if(e.key === "ArrowDown"){ mudar(i, -1); e.preventDefault(); }
      else if(e.key === "Backspace"){ definir(i, 0); if(i > 0) $("dig" + (i - 1)).focus(); e.preventDefault(); }
      else if(e.key === "Enter"){ tentar(); e.preventDefault(); }
    });
    let y0 = null;                                                            // deslizar o dedo para cima/baixo
    dig.addEventListener("pointerdown", e => { y0 = e.clientY; dig.setPointerCapture(e.pointerId); dig.focus(); });
    dig.addEventListener("pointerup", e => { if(y0 !== null){ const dy = e.clientY - y0; if(Math.abs(dy) > 16) mudar(i, dy < 0 ? 1 : -1); y0 = null; } });
    box.appendChild(r);
  }
}
function definir(i, v){
  valores[i] = ((v % 10) + 10) % 10; const d = $("dig" + i);
  d.textContent = valores[i]; d.setAttribute("aria-valuenow", valores[i]);
  d.classList.remove("muda"); void d.offsetWidth; d.classList.add("muda");
  if(!travado){ cartao.classList.remove("erro"); msg.textContent = ""; }
}
const mudar = (i, d) => definir(i, valores[i] + d);

function tentar(){
  if(travado) return;
  const codigo = valores.join("");
  if(sha256(SAL + codigo) === CODIGO_HASH) abrir(); else errar();
}
function errar(){
  erros++; cartao.classList.remove("erro"); void cartao.offsetWidth; cartao.classList.add("erro");
  if(navigator.vibrate) try{ navigator.vibrate(80); }catch(e){}
  if(erros >= MAX_ERROS){ rodadas++; esperar(ESPERA_S * Math.pow(2, rodadas - 1)); erros = 0; }
  else{ const resta = MAX_ERROS - erros; msg.textContent = `Código incorreto. Tente de novo (${resta} ${resta === 1 ? "tentativa" : "tentativas"} antes de uma pausa).`; }
}
function esperar(seg){
  travado = true; $("rodas").classList.add("travado"); $("btnAbrir").disabled = true;
  const fim = Date.now() + seg * 1000;
  const tic = () => {
    const r = Math.ceil((fim - Date.now()) / 1000);
    if(r <= 0){ clearInterval(espera); travado = false; $("rodas").classList.remove("travado"); $("btnAbrir").disabled = false; cartao.classList.remove("erro"); msg.textContent = "Pode tentar de novo."; return; }
    msg.textContent = `Muitas tentativas. Aguarde ${r} s para tentar de novo.`;
  };
  tic(); espera = setInterval(tic, 250);
}
function abrir(){
  erros = 0; rodadas = 0; cartao.classList.remove("erro"); cartao.classList.add("aberto");
  $("titulo").textContent = MENSAGEM.titulo; $("sub").hidden = true; $("painel").hidden = true;
  $("sucTexto").textContent = MENSAGEM.texto; $("sucesso").hidden = false;
  const hora = () => { $("horaVal").textContent = new Date().toLocaleTimeString("pt-BR"); };
  hora(); clearInterval(relogio); relogio = setInterval(hora, 1000);
  if(navigator.vibrate) try{ navigator.vibrate([60, 60, 120]); }catch(e){}
  $("titulo").style.color = "#157A43";
}
function fechar(){
  clearInterval(relogio); cartao.classList.remove("aberto", "erro");
  $("titulo").textContent = "Digite o código"; $("titulo").style.color = ""; $("sub").hidden = false; $("painel").hidden = false; $("sucesso").hidden = true;
  [0, 1, 2].forEach(i => definir(i, 0)); msg.textContent = ""; $("dig0").focus();
}
$("btnAbrir").onclick = tentar; $("btnFechar").onclick = fechar;

/* =========================================================
   AJUDANTE DA EQUIPE: ?hash=CODIGO mostra a linha para colar em CODIGO_HASH
   ========================================================= */
if(params.has("hash")){
  const c = params.get("hash"), h = $("helper"); h.hidden = false;
  h.innerHTML = `Linha para colar no arquivo (código de ${c.length} caracteres, SAL atual):<code>const CODIGO_HASH = "${sha256(SAL + c)}";</code>`;
}

/* =========================================================
   CARTAZ COM QR CODE (?cartaz)
   ========================================================= */
function baseUrl(){
  const u = params.get("url");
  if(u && /^https:\/\/[^\s"'<>]+$/.test(u)) return u;
  const p = location.pathname.replace(/index\.html$/, "");
  return ((location.origin && location.origin !== "null") ? location.origin : "file://") + p;
}
function qrSvg(url, cor = "#0B2540"){
  const qr = qrcode(0, "Q"); qr.addData(url); qr.make();
  const n = qr.getModuleCount(), q = 4, tam = n + q * 2, loc = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${tam} ${tam}" shape-rendering="geometricPrecision" role="img" aria-label="QR Code"><rect width="${tam}" height="${tam}" fill="#fff"/>`;
  for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) if(qr.isDark(r, c) && !loc(r, c)) s += `<rect x="${c+q+.03}" y="${r+q+.03}" width=".94" height=".94" rx=".22" fill="${cor}"/>`;
  [[0,0],[0,n-7],[n-7,0]].forEach(([r, c]) => { const x = c + q, y = r + q; s += `<rect x="${x+.5}" y="${y+.5}" width="6" height="6" fill="none" stroke="${cor}" stroke-width="1"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="${cor}"/>`; });
  return s + "</svg>";
}
function helixSvg(){
  const W = 60, H = 1000, amp = 18, per = 220, cx = 30; let a = "", b = "", rungs = "";
  for(let y = 0; y <= H; y += 8){ const x = Math.sin(y / per * Math.PI * 2) * amp; a += (y ? "L" : "M") + (cx + x).toFixed(1) + " " + y; b += (y ? "L" : "M") + (cx - x).toFixed(1) + " " + y; }
  for(let y = 10; y < H; y += 22){ const x = Math.sin(y / per * Math.PI * 2) * amp; rungs += `<line x1="${(cx+x).toFixed(1)}" y1="${y}" x2="${(cx-x).toFixed(1)}" y2="${y}" stroke="#A9CFE4" stroke-width="2.4" stroke-linecap="round"/>`; }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" width="100%" height="100%" aria-hidden="true">${rungs}<path d="${a}" fill="none" stroke="#0B78A5" stroke-width="3.4" stroke-linecap="round"/><path d="${b}" fill="none" stroke="#5BB6D6" stroke-width="3.4" stroke-linecap="round"/></svg>`;
}
function cartaz(){
  const url = baseUrl(), el = $("cartaz"), local = !location.origin || location.origin === "null" || /^(localhost|127\.|0\.0\.0\.0)/.test(location.hostname);
  const usaUrl = params.get("url") && url === params.get("url");
  const logoA = document.querySelector(".topo .a").src, logoB = document.querySelector(".topo .b").src;
  el.innerHTML = `<div class="ferr"><button class="btn" id="btnImp" type="button">Imprimir cartaz (A4)</button>
      <p class="${local && !usaUrl ? "alerta" : ""}">${local && !usaUrl ? "Atenção: esta página está em um endereço local. O QR só funcionará depois de publicar o site e abrir o cartaz pelo endereço público." : "O QR Code aponta para: " + url}</p></div>
    <section class="folha"><div class="dna e">${helixSvg()}</div><div class="dna d">${helixSvg()}</div>
      <div class="lg"><img src="${logoA}" alt="CEGGen"><span class="v"></span><img class="b" src="${logoB}" alt="GenIA"></div>
      <p class="eb">CADEADO DIGITAL</p><h2>Descubra o código e abra o cadeado</h2><span class="md">3 dígitos</span>
      <div class="qr">${qrSvg(url)}</div><p class="ct">Aponte a câmera do celular para o QR Code</p>
      <ol><li><b>1</b><span>Escaneie o QR Code e abra a página.</span></li><li><b>2</b><span>Gire as rodinhas até formar o código de 3 dígitos.</span></li><li><b>3</b><span>Toque em “Abrir cadeado”.</span></li></ol>
      <p class="cr">Desenvolvido pela equipe de Bioinformática do CEGGen em parceria com a equipe do GenIA.</p></section>`;
  el.hidden = false; document.querySelector("main").hidden = true; $("btnImp").onclick = () => print(); document.title = "Cartaz · Cadeado digital";
}

construirRodas();
if(params.has("cartaz")) cartaz();
window.__fechadura = { sha256 };            // gancho de teste
